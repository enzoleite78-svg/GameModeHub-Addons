name: Atualizar catalogo de temas

# Quando um tema e aprovado (entra na branch main), regenera temas/catalogo.json sozinho:
# calcula o SHA-256 e le nome/autor/descricao do tema.json.
# O selo "Oficial" so vale para ids listados em temas/oficiais.txt (so o dono edita).
on:
  push:
    branches: [main]
    paths:
      - "temas/*.gmhtema"
      - "temas/oficiais.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar o catalogo
        run: python3 .github/scripts/temas.py --gerar
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temas
          if git diff --cached --quiet; then
            echo "Catalogo ja esta em dia."
          else
            git commit -m "Atualiza o catalogo de temas"
            git push
          fi
